<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexNova · Simulación Estratégica FODA</title>
<style>
  :root {
    --bg-page: #101418;
    --bg-header: #161b21;
    --border-dark: #2a313a;
    --text-dark: #e3e8ee;
    --text-muted: #8d99a6;
    --paper: #ffffff;
    --paper-alt: #f5f7f8;
    --ink: #12171d;
    --ink-soft: #3a444e;
    --ink-faint: #6d7883;
    --rule: #e3e7ea;
    --f-color: #0f6a4c;
    --d-color: #a35a08;
    --o-color: #17518f;
    --a-color: #a81c3c;
    --serif: "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--bg-page);
    color: var(--text-dark);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1300px; margin: 0 auto; padding: 0 24px 96px; }
  .top-panel { background-color: var(--bg-header); border-bottom: 1px solid var(--border-dark); }
  .top-panel-inner {
    max-width: 1300px; margin: 0 auto; padding: 18px 24px;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px; justify-content: space-between;
  }
  .brand h1 { font-family: var(--serif); font-size: 1.45rem; letter-spacing: 0.06em; color: #ffffff; font-weight: 700; }
  .brand span { display: block; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }
  .kpis { display: flex; gap: 1px; flex-wrap: wrap; flex: 1; justify-content: flex-end; background: var(--border-dark); border: 1px solid var(--border-dark); }
  .kpi { background: #1b2128; padding: 12px 18px; min-width: 232px; flex: 1; max-width: 280px; }
  .kpi-label { font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.11em; color: var(--text-muted); text-transform: uppercase; display: block; }
  .kpi-val { font-family: var(--sans); font-size: 1.4rem; font-weight: 700; color: #ffffff; display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
  .kpi-delta { font-size: 0.72rem; font-weight: 700; font-family: var(--mono); }
  .delta-up { color: #6ea8d8; }
  .delta-down { color: #9aa5b1; }
  .kpi-desc { font-size: 0.7rem; color: var(--text-muted); line-height: 1.35; margin-top: 8px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 28px 0 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border-dark); }
  .progress { display: flex; list-style: none; gap: 26px; }
  .progress li { font-family: var(--mono); font-size: 0.74rem; text-transform: uppercase; color: #6f7b87; display: flex; align-items: center; gap: 9px; }
  .progress li.current { color: #ffffff; }
  .progress li.done { color: #4ec99a; }
  .progress .step-num { display: flex; align-items: center; justify-content: center; width: 23px; height: 23px; border: 1px solid currentColor; font-size: 0.68rem; }
  .progress li.current .step-num { background: #ffffff; color: var(--bg-page); border-color: #ffffff; }
  .progress li.done .step-num { border-color: #4ec99a; }
  .reset-btn { background: transparent; border: 1px solid #3b444e; color: var(--text-dark); font-family: var(--mono); font-size: 0.72rem; padding: 8px 15px; cursor: pointer; text-transform: uppercase; }
  .grid-layout { display: grid; grid-template-columns: 1fr; gap: 34px; }
  @media(min-width: 1040px) { .grid-layout { grid-template-columns: 1.12fr 0.88fr; align-items: start; } }
  .paper { background: var(--paper); color: var(--ink); padding: 40px; }
  .log-entry { border: 1px solid var(--border-dark); border-left: 3px solid #6d7883; padding: 13px 20px; margin-bottom: 10px; background: #171c22; font-size: 0.85rem; }
  .log-entry strong { color: #ffffff; }
  .eyebrow { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 14px; display: block; }
  .chapter-title { font-family: var(--serif); font-size: 2.15rem; font-weight: 700; margin-bottom: 22px; color: var(--ink); }
  .prose p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.68; margin-bottom: 18px; color: var(--ink-soft); }
  .decisions { margin-top: 34px; border-top: 2px solid var(--ink); padding-top: 26px; }
  .option-btn { display: block; text-align: left; width: 100%; background: #ffffff; border: 1px solid var(--rule); border-left: 4px solid #c9d0d6; padding: 18px 20px; cursor: pointer; margin-bottom: 12px; }
  .option-btn:hover { border-left-color: var(--ink); background: var(--paper-alt); }
  .opt-text { font-size: 1.02rem; font-weight: 700; color: var(--ink); }
  .opt-desc { font-family: var(--serif); font-size: 0.98rem; color: var(--ink-soft); }
  .impact-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; color: var(--ink); }
  .impact-table th { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .impact-table td { text-align: right; font-family: var(--mono); border-bottom: 1px solid var(--rule); }
  .primary-btn { background: var(--ink); color: #ffffff; border: none; padding: 14px 26px; font-weight: 700; cursor: pointer; width: 100%; }
  .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #c9d0d6; border: 1px solid #c9d0d6; }
  .quadrant { background: #ffffff; padding: 16px; min-height: 210px; color: var(--ink); }
  .q-F { border-top: 5px solid var(--f-color); }
  .q-D { border-top: 5px solid var(--d-color); }
  .q-O { border-top: 5px solid var(--o-color); }
  .q-A { border-top: 5px solid var(--a-color); }
  .q-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
  .factor-list { list-style: none; font-size: 0.85rem; }
  .factor-list code { font-family: var(--mono); font-weight: 700; padding: 2px 5px; border: 1px solid currentColor; margin-right: 5px; }
  .verdict-head { border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 26px; color: var(--ink); }
  .balance-section { margin: 30px 0; }
  .balance-row { display: grid; grid-template-columns: 108px 1fr 58px; align-items: center; gap: 14px; margin-bottom: 9px; color: var(--ink); }
  .b-track { height: 14px; background: var(--paper-alt); border: 1px solid var(--rule); position: relative; }
  .b-fill { height: 100%; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<header class="top-panel"><div class="top-panel-inner"><div class="brand"><h1>LexNova</h1><span>Simulación FODA · Lima</span></div><div class="kpis" id="kpi-container"></div></div></header>
<div class="container">
  <div class="toolbar"><ol class="progress" id="progress-bar"></ol><button class="reset-btn" id="btn-reset">Reiniciar caso</button></div>
  <main class="grid-layout">
    <section class="col-narrative"><ul class="log-entries" id="log-container"></ul><div class="paper" id="stage-container"></div></section>
    <section class="col-matrix">
      <div class="matrix-header"><h2>Matriz FODA acumulada</h2><span id="matrix-tally">0 factores</span></div>
      <div class="matrix-grid">
        <div class="quadrant q-F"><div class="q-head"><span class="letter">F</span><span class="title">Fortalezas</span><span class="count" id="count-F">0</span></div><ul class="factor-list" id="list-F"></ul></div>
        <div class="quadrant q-D"><div class="q-head"><span class="letter">D</span><span class="title">Debilidades</span><span class="count" id="count-D">0</span></div><ul class="factor-list" id="list-D"></ul></div>
        <div class="quadrant q-O"><div class="q-head"><span class="letter">O</span><span class="title">Oportunidades</span><span class="count" id="count-O">0</span></div><ul class="factor-list" id="list-O"></ul></div>
        <div class="quadrant q-A"><div class="q-head"><span class="letter">A</span><span class="title">Amenazas</span><span class="count" id="count-A">0</span></div><ul class="factor-list" id="list-A"></ul></div>
      </div>
    </section>
  </main>
</div>
<script>
(function(){
  const INIT_KPIS = { margen: 22, caja: 300000, concentracion: 30 };
  const BASE_FACTORS = [
    {q:"F", w:2, text:"Marca del estudio con 28 años de trayectoria en Lima."},
    {q:"D", w:2, text:"78% de ingresos provienen de horas facturables."},
    {q:"O", w:2, text:"Nuevas normas de compliance regional."},
    {q:"A", w:3, text:"Legaltechs ofrecen contratos a bajo costo."}
  ];
  const CHAPTERS = [
    {
      short: "Mercado", title: "Un cliente migra a la automatización",
      body: ["Aurelia Foods, cliente recurrente desde hace seis años, no renovará su contrato mensual: migró sus contratos estándar a una plataforma legaltech que cobra una fracción de tu tarifa por hora.", "No es un caso aislado: es la tercera cuenta mediana que recorta presupuesto legal este trimestre, y el comité debe decidir cómo responder antes de que la fuga de clientes se generalice."],
      prompt: "Decisión 1 · Respuesta tecnológica",
      options: [
        { key: "A", title: "Ajuste de tarifas", desc: "Bajar la tarifa por hora a un nivel competitivo con las legaltechs para no perder volumen de clientes estándar.", consequence: "Retienes el 88% de la cartera pero el margen se comprime y el talento junior se desmotiva.", kpiDeltas: { margen: -8, caja: 20000, concentracion: -5 }, items: [{q:"F", w:2, text:"Retención del 88% de la cartera."}, {q:"D", w:3, text:"Margen comprimido."}] },
        { key: "B", title: "Licencia de software", desc: "Contratar una plataforma externa que automatice la revisión de contratos rutinarios, combinada con asesoría humana para casos complejos.", consequence: "La eficiencia mejora pero la adopción entre socios senior es parcial.", kpiDeltas: { margen: 5, caja: -40000, concentracion: 5 }, items: [{q:"F", w:2, text:"Revisión baja de 6 a 2 horas."}, {q:"O", w:2, text:"Servicio mixto competitivo."}] },
        { key: "C", title: "Reenfoque M&A", desc: "Cerrar el área de contratos estándar y concentrar al equipo en fusiones y adquisiciones de alta complejidad.", consequence: "El margen sube pero el riesgo aumenta al depender de muy pocos clientes grandes.", kpiDeltas: { margen: 15, caja: -80000, concentracion: 25 }, items: [{q:"F", w:3, text:"Especialización en servicios premium."}, {q:"D", w:3, text:"Alta concentración de facturación."}] }
      ]
    },
    {
      short: "Capital", title: "Asignación del fondo de reserva",
      body: ["El estudio acumula un fondo en dólares construido durante los años de bonanza, pensado originalmente como colchón ante una crisis, no como capital de inversión.", "Con la competencia digital ganando terreno, el comité debe decidir si ese fondo se queda intacto o se convierte en el motor de la próxima etapa del estudio."],
      prompt: "Decisión 2 · Gestión de capital",
      options: [
        { key: "A", title: "Mantener reserva", desc: "No invertir por ahora y conservar el fondo como colchón de liquidez ante un año incierto.", consequence: "Conservas liquidez total pero pierdes competitividad ante clientes que exigen gestión en línea.", kpiDeltas: { margen: -2, caja: 0, concentracion: 0 }, items: [{q:"F", w:3, text:"Liquidez para un año de operación."}, {q:"A", w:2, text:"Pérdida de cuentas por falta de portal."}] },
        { key: "B", title: "Portal en la nube", desc: "Contratar un servicio SaaS externo que dé a los clientes acceso en tiempo real a sus casos, sin desarrollar tecnología propia.", consequence: "Mejora la atención y facturación, aunque dependes de un proveedor externo.", kpiDeltas: { margen: 3, caja: -30000, concentracion: 0 }, items: [{q:"O", w:2, text:"Facturación administrativa reducida."}, {q:"F", w:2, text:"Portal de cliente en tiempo real."}] },
        { key: "C", title: "Software propio", desc: "Invertir la mayor parte del fondo en construir un sistema propio de análisis legal, con potencial de convertirse en un producto vendible.", consequence: "El desarrollo drena la reserva pero creas un activo único con potencial de venta.", kpiDeltas: { margen: -5, caja: -200000, concentracion: -10 }, items: [{q:"O", w:3, text:"Potencial línea de ingresos SaaS."}, {q:"D", w:3, text:"Reserva reducida a 3 meses."}] }
      ]
    },
    {
      short: "Expansión", title: "Licitación regional",
      body: ["Un consorcio multinacional evalúa contratar un solo estudio legal para sus operaciones en Perú, Chile y Colombia: un contrato que triplicaría la facturación actual con un solo cliente.", "El estudio nunca ha operado fuera de Lima, y el comité debe decidir cómo cubrir la capacidad regional sin comprometer la calidad que sostiene su reputación."],
      prompt: "Decisión 3 · Cobertura regional",
      options: [
        { key: "A", title: "Derivación local", desc: "Firmar convenios con estudios ya establecidos en Chile y Colombia y coordinar el trabajo a distancia, sin abrir oficinas propias.", consequence: "Sin inversión, pero pierdes control de calidad y la facturación no es unificada.", kpiDeltas: { margen: 0, caja: 0, concentracion: 0 }, items: [{q:"A", w:3, text:"Falta de control en plazos externos."}, {q:"D", w:2, text:"Sin facturación unificada."}] },
        { key: "B", title: "Sociedad conjunta", desc: "Crear una entidad legal compartida con estudios pares de la región para presentarse juntos ante el consorcio.", consequence: "Ganan la licitación corporativa y diversifican ingresos, pero la toma de decisiones es lenta.", kpiDeltas: { margen: 4, caja: -50000, concentracion: -5 }, items: [{q:"O", w:3, text:"Licitación ganada con facturación regional."}, {q:"F", w:2, text:"34% ingresos fuera de Perú."}] },
        { key: "C", title: "Compra de estudios", desc: "Adquirir estudios pequeños ya operando en Chile y Colombia para tener presencia y control directo inmediato.", consequence: "Control total y margen completo, pero el endeudamiento es alto y la integración difícil.", kpiDeltas: { margen: 8, caja: -180000, concentracion: -15 }, items: [{q:"F", w:3, text:"Control directo regional."}, {q:"A", w:3, text:"Deuda sensible a tasas de interés."}] }
      ]
    }
  ];
  let state = { step: 0, phase: "choosing", history: [], factors: [], counters: {F:0,D:0,O:0,A:0}, lastBatch: 0, kpis: {...INIT_KPIS}, lastDeltas: {margen:0,caja:0,concentracion:0} };
  function formatDelta(id, delta){
    if (delta === 0) return '';
    const cls = delta > 0 ? 'delta-up' : 'delta-down';
    const sign = delta > 0 ? '+' : '';
    const text = id === 'caja' ? `${sign}$${delta.toLocaleString()}` : `${sign}${delta}%`;
    return `<span class="kpi-delta ${cls}">${text}</span>`;
  }
  function addFactor(q, w, text, b) { state.counters[q]++; const code = q+'-'+String(state.counters[q]).padStart(2,'0'); state.factors.push({q,w,text,batchId:b,code}); }
  const Q_INFO = {
    F: { label: 'Fortalezas', varColor: '--f-color' },
    D: { label: 'Debilidades', varColor: '--d-color' },
    O: { label: 'Oportunidades', varColor: '--o-color' },
    A: { label: 'Amenazas', varColor: '--a-color' }
  };
  function quadrantSums(){
    const sums = {F:0,D:0,O:0,A:0};
    state.factors.forEach(f => sums[f.q] += f.w);
    return sums;
  }
  function renderBalanceRows(sums){
    const maxSum = Math.max(sums.F, sums.D, sums.O, sums.A, 1);
    return ['F','D','O','A'].map(q => {
      const pct = Math.round(sums[q] / maxSum * 100);
      return `<div class="balance-row"><span>${Q_INFO[q].label}</span><div class="b-track"><div class="b-fill" style="width:${pct}%;background:var(${Q_INFO[q].varColor})"></div></div><span>${sums[q]}</span></div>`;
    }).join('');
  }
  const STRATEGY_ARCHETYPES = {
    FO: { name: 'Estrategia Ofensiva (FO)', desc: 'las fortalezas acumuladas superan a las debilidades, y el entorno percibido es más de oportunidad que de amenaza. Es el patrón típico de decisiones que buscan crecer y capturar mercado apalancándose en las capacidades propias del estudio.' },
    FA: { name: 'Estrategia Defensiva (FA)', desc: 'las fortalezas dominan sobre las debilidades, pero el entorno percibido es más amenazante que oportuno. Es el patrón típico de decisiones que usan las capacidades del estudio para blindarse frente a riesgos externos, más que para expandirse.' },
    DO: { name: 'Estrategia de Reorientación (DO)', desc: 'las debilidades pesan más que las fortalezas, aunque el entorno ofrece más oportunidades que amenazas. Es el patrón típico de decisiones que buscan corregir vulnerabilidades internas apoyándose en condiciones externas favorables.' },
    DA: { name: 'Estrategia de Supervivencia (DA)', desc: 'las debilidades superan a las fortalezas y el entorno percibido es más amenazante que oportuno. Es el patrón típico de decisiones defensivas, orientadas a minimizar pérdidas antes que a crecer.' }
  };
  function classifyStrategy(sums){
    const key = (sums.F >= sums.D ? 'F' : 'D') + (sums.O >= sums.A ? 'O' : 'A');
    return STRATEGY_ARCHETYPES[key];
  }
  function buildNarrative(sums){
    const strat = classifyStrategy(sums);
    const margenDelta = state.kpis.margen - INIT_KPIS.margen;
    const cajaDelta = state.kpis.caja - INIT_KPIS.caja;
    const concDelta = state.kpis.concentracion - INIT_KPIS.concentracion;

    let finance = 'En términos financieros, ';
    finance += margenDelta > 0 ? `el margen operativo mejoró ${margenDelta} puntos respecto al inicio` : margenDelta < 0 ? `el margen operativo cayó ${Math.abs(margenDelta)} puntos respecto al inicio` : 'el margen operativo se mantuvo sin cambios respecto al inicio';
    finance += cajaDelta >= 0 ? `, la caja aumentó en $${cajaDelta.toLocaleString()}` : `, la caja se redujo en $${Math.abs(cajaDelta).toLocaleString()}`;
    finance += concDelta > 0 ? ` y el riesgo de concentración de clientes aumentó ${concDelta} puntos — el estudio quedó más expuesto a perder pocas cuentas grandes.` : concDelta < 0 ? ` y el riesgo de concentración de clientes disminuyó ${Math.abs(concDelta)} puntos — la cartera quedó más diversificada.` : ' y el riesgo de concentración se mantuvo estable.';

    const p1 = `<p>El patrón de decisiones tomadas corresponde a una <strong>${strat.name}</strong>: ${strat.desc}</p>`;
    const p2 = `<p>${finance}</p>`;
    const p3 = `<p>Ninguna de las cuatro rutas —ofensiva, defensiva, de reorientación o de supervivencia— es "la correcta" en abstracto: cada una implica un trade-off distinto entre crecer, controlar el riesgo y preservar capital. Vale la pena revisar si esta combinación de decisiones fue una estrategia deliberada o el resultado de responder cada escenario de forma aislada.</p>`;
    return p1 + p2 + p3;
  }
  function renderVerdict(){
    const sums = quadrantSums();
    return `<div class="verdict-head"><span class="eyebrow">Diagnóstico Final</span><h2 class="chapter-title">Balance Estratégico</h2></div>
      <div class="prose">${buildNarrative(sums)}</div>
      <div class="balance-section">${renderBalanceRows(sums)}</div>
      <div class="prose"><span class="eyebrow">Para el debate</span><p>¿Las decisiones que tomaste fueron basadas en el temor, en la confianza o en la falta de información?</p></div>
      <button class="primary-btn" onclick="window.exportSummary()">Descargar resumen (.txt)</button>
      <button class="primary-btn" style="margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--ink)" onclick="location.reload()">Reiniciar Simulación</button>`;
  }
  window.exportSummary = () => {
    const sums = quadrantSums();
    const strat = classifyStrategy(sums);
    const lines = [];
    lines.push('LexNova · Resumen de tu simulación');
    lines.push('='.repeat(40));
    lines.push('');
    lines.push('Decisiones tomadas:');
    state.history.forEach(h => {
      const ch = CHAPTERS[h.step];
      const opt = ch.options.find(o=>o.key===h.optKey);
      lines.push(`- ${ch.short}: ${opt.title}`);
    });
    lines.push('');
    lines.push('KPIs finales:');
    lines.push(`- Margen operativo: ${state.kpis.margen}% (inicio: ${INIT_KPIS.margen}%)`);
    lines.push(`- Caja fuerte: $${state.kpis.caja.toLocaleString()} (inicio: $${INIT_KPIS.caja.toLocaleString()})`);
    lines.push(`- Riesgo de concentración: ${state.kpis.concentracion}% (inicio: ${INIT_KPIS.concentracion}%)`);
    lines.push('');
    lines.push(`Arquetipo estratégico resultante: ${strat.name}`);
    lines.push(strat.desc);
    lines.push('');
    lines.push('Matriz FODA acumulada:');
    ['F','D','O','A'].forEach(q => {
      lines.push(`${Q_INFO[q].label} (peso total: ${sums[q]}):`);
      state.factors.filter(f=>f.q===q).forEach(f => lines.push(`  ${f.code} — ${f.text}`));
    });
    const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lexnova-resumen.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  function renderAll(){
    const kC = document.getElementById('kpi-container');
    const kDefs = [
      {id:'margen', l:'Margen operativo', v:state.kpis.margen+'%', d:'Ganancia por sol facturado.'},
      {id:'caja', l:'Caja fuerte (USD)', v:'$'+state.kpis.caja.toLocaleString(), d:'Flujo de caja libre.'},
      {id:'concentracion', l:'Riesgo concentración', v:state.kpis.concentracion+'%', d:'Dependencia de clientes clave.'}
    ];
    kC.innerHTML = kDefs.map(d => `<div class="kpi"><span class="kpi-label">${d.l}</span><div class="kpi-val">${d.v}${formatDelta(d.id, state.kpis[d.id]-INIT_KPIS[d.id])}</div><p class="kpi-desc">${d.d}</p></div>`).join('');
    const sC = document.getElementById('stage-container');
    if(state.phase==="end"){
      sC.innerHTML = renderVerdict();
    } else {
      const ch = CHAPTERS[state.step];
      if(state.phase==="choosing"){
        sC.innerHTML = `<h2 class="chapter-title">${ch.title}</h2><div class="prose">${ch.body.map(p=>`<p>${p}</p>`).join('')}</div><div class="decisions"><h3 class="decision-prompt">${ch.prompt}</h3>${ch.options.map(o=>`<button class="option-btn" onclick="window.makeChoice('${o.key}')"><span class="opt-text">${o.title}</span><br><span class="opt-desc">${o.desc}</span></button>`).join('')}</div>`;
      } else {
        const opt = ch.options.find(o=>o.key===state.history[state.step].optKey);
        sC.innerHTML = `<h2 class="chapter-title">Resultado</h2><p class="prose">${opt.consequence}</p><button class="primary-btn" onclick="window.advance()">Siguiente etapa</button>`;
      }
    }
    ['F','D','O','A'].forEach(q => {
      document.getElementById('count-'+q).textContent = state.counters[q];
      const list = document.getElementById('list-'+q);
      list.innerHTML = state.factors.filter(f=>f.q===q).map(f=>`<li><code>${f.code}</code> ${f.text}</li>`).join('');
    });
    document.getElementById('matrix-tally').textContent = state.factors.length + ' factores';
    renderProgress();
    renderLog();
  }
  function renderProgress(){
    const pb = document.getElementById('progress-bar');
    pb.innerHTML = CHAPTERS.map((c,i) => {
      let cls = '';
      if (i < state.step) cls = 'done';
      else if (i === state.step && state.phase !== 'end') cls = 'current';
      return `<li class="${cls}"><span class="step-num">${i+1}</span>${c.short}</li>`;
    }).join('');
  }
  function renderLog(){
    const lc = document.getElementById('log-container');
    lc.innerHTML = state.history.map(h => {
      const ch = CHAPTERS[h.step];
      const opt = ch.options.find(o=>o.key===h.optKey);
      return `<li class="log-entry"><strong>${ch.short}:</strong> ${opt.title}</li>`;
    }).reverse().join('');
  }
  window.makeChoice = (key) => {
    const opt = CHAPTERS[state.step].options.find(o=>o.key===key);
    state.history.push({step:state.step, optKey:key});
    state.kpis.margen += opt.kpiDeltas.margen;
    state.kpis.caja += opt.kpiDeltas.caja;
    state.kpis.concentracion += opt.kpiDeltas.concentracion;
    state.lastBatch++;
    opt.items.forEach(i => addFactor(i.q, i.w, i.text, state.lastBatch));
    state.phase = "result";
    renderAll();
  };
  window.advance = () => { state.step++; state.phase = state.step >= CHAPTERS.length ? "end" : "choosing"; renderAll(); };
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('¿Reiniciar el caso? Se perderá el progreso actual.')) location.reload();
  });
  BASE_FACTORS.forEach(f => addFactor(f.q, f.w, f.text, 0));
  renderAll();
})();
</script>
</body>
</html>
